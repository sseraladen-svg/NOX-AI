<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" style="enable-background:new 0 0 30 30;" xml:space="preserve">
  <defs>
    <style type="text/css">
      .nox-bg { fill: none; }
      .nox-letter { fill: #ffffff; font-family: Arial, sans-serif; font-weight: bold; font-size: 18px; }
      .nox-breathe { animation: nox-breathe 2.5s ease-in-out infinite; }
      @keyframes nox-breathe {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
    </style>
  </defs>
  <g>
    <rect x="1" y="1" width="28" height="28" rx="6" fill="#6366f1"/>
    <g class="nox-breathe">
      <text x="15" y="21" text-anchor="middle" class="nox-letter">N</text>
    </g>
  </g>
</svg>
