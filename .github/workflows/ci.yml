name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy values: the build only needs them to exist, nothing connects to a database.
      DATABASE_URL: postgresql://user:pass@localhost:5432/nox
      POSTGRES_URL: postgresql://user:pass@localhost:5432/nox
      NOX_AI_SECRET: ci-only-secret-not-used-anywhere-else
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
